<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Arcade | Big Head Billionaires</title>
  <meta name="description" content="Play original Big Head Billionaires games free in your browser — no sign-in, no downloads."/>
  <meta property="og:title"        content="BHB Arcade | Big Head Billionaires"/>
  <meta property="og:description"  content="Play original Big Head Billionaires games free in your browser."/>
  <meta property="og:image"        content="../assets/game.png"/>
  <meta property="og:url"          content="https://bigheadbillionaires.com/games/"/>
  <meta name="twitter:card"        content="summary_large_image"/>
  <meta name="twitter:site"        content="@bigheadbillions"/>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹️</text></svg>"/>
  <link rel="stylesheet" href="../assets/bhb.css"/>

  <style>
    /* ── PAGE HEADER ───────────────────────────────── */
    .page-header {
      margin-top: 62px;
      background: var(--black);
      border-bottom: 4px solid var(--black);
      padding: 1.4rem 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .page-header-left .kicker {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: rgba(255,255,255,0.4);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.15rem;
    }
    .page-header h1 {
      font-family: var(--font-display);
      font-size: 2.6rem;
      color: var(--yellow);
      letter-spacing: 0.04em;
      line-height: 1;
      margin: 0;
    }
    .page-header p {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      color: rgba(255,255,255,0.35);
      margin-top: 0.3rem;
    }

    /* ── GAME SELECTOR STRIP ───────────────────────── */
    .game-selector {
      background: var(--bg);
      border-bottom: 3px solid var(--black);
      padding: 1.1rem 2rem;
      display: flex;
      justify-content: center;
      gap: 0.9rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .game-selector::-webkit-scrollbar { display: none; }

    .game-card {
      flex: 0 0 150px;
      border: 3px solid var(--black);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      background: var(--bg-card);
      box-shadow: 3px 3px 0 rgba(0,0,0,0.15);
      transition: transform 0.1s, box-shadow 0.1s, border-color 0.15s;
      position: relative;
      user-select: none;
    }
    .game-card:hover {
      transform: translate(-2px,-3px);
      box-shadow: 5px 6px 0 var(--black);
    }
    .game-card.active {
      border-color: var(--yellow);
      box-shadow: 4px 5px 0 var(--yellow);
      transform: translate(-2px,-3px);
    }
    .game-card-thumb {
      width: 100%; aspect-ratio: 16/9;
      background: #0d1728;
      display: flex; align-items: center; justify-content: center;
      font-size: 2.2rem;
      border-bottom: 2px solid var(--black);
    }
    .game-card.active .game-card-thumb { background: #171f30; }
    .game-card-body  { padding: 0.55rem 0.7rem; }
    .game-card-title { font-family: var(--font-display); font-size: 0.75rem; letter-spacing: 0.04em; line-height: 1.2; }
    .game-card-sub   { font-family: var(--font-mono); font-size: 0.55rem; color: #888; margin-top: 0.2rem; }

    /* ── MAIN LAYOUT — single centered column ──────── */
    .game-layout {
      display: flex;
      justify-content: center;
      padding: 1.75rem 2rem;
    }

    /* ── GAME COLUMN (size set by JS) ──────────────── */
    .game-column { flex: 0 0 auto; }

    .game-container {
      border: 3px solid var(--black);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
    }
    .game-header {
      background: var(--black);
      padding: 0.6rem 1.1rem;
      display: flex; align-items: center; justify-content: center;
    }
    .game-title { font-family: var(--font-display); font-size: 0.9rem; color: var(--yellow); letter-spacing: 0.08em; }

    /* Frame wrapper — sized by JS to preserve aspect ratio */
    .game-frame-wrap {
      background: #000;
      display: block;
      overflow: hidden;
      position: relative;
      touch-action: none;   /* don't let the portal page steal touches */
      overscroll-behavior: none;
    }
    .game-frame-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
      display: block;
      touch-action: none;
    }

    /* ── MOBILE ────────────────────────────────────── */
    @media (max-width: 780px) {
      .game-layout { padding: 1rem; }
      .game-column { width: 100% !important; flex-basis: auto !important; }
      .game-frame-wrap { width: 100% !important; }

      .page-header { padding: 1rem 1.25rem; }
      /* Left-align the selector on small screens so it scrolls from the start */
      .game-selector { padding: 0.85rem 1.25rem; justify-content: flex-start; }
    }
  </style>
</head>
<body>

<!-- Nav -->
<script src="/assets/nav.js"></script>

<!-- ─── PAGE HEADER ─────────────────────────────────────────────────────────── -->
<div class="page-header">
  <div class="page-header-left">
    <div class="kicker">🕹️ Big Head Billionaires</div>
    <h1>ARCADE</h1>
    <p>PLAY · FREE · NO SIGN-IN</p>
  </div>
</div>

<!-- ─── GAME SELECTOR ──────────────────────────────────────────────────────── -->
<div class="game-selector">

  <div class="game-card" data-game="burgerdrop" onclick="selectGame(this)">
    <div class="game-card-thumb">🍔</div>
    <div class="game-card-body">
      <div class="game-card-title">BURGER DROP</div>
      <div class="game-card-sub">Original · Arcade</div>
    </div>
  </div>

  <div class="game-card active" data-game="burgerbreaker" onclick="selectGame(this)">
    <div class="game-card-thumb">🧱</div>
    <div class="game-card-body">
      <div class="game-card-title">BURGER BREAKER</div>
      <div class="game-card-sub">Breakout · 25 Levels</div>
    </div>
  </div>

  <div class="game-card" data-game="burgtycoon" onclick="selectGame(this)">
    <div class="game-card-thumb">🏙️</div>
    <div class="game-card-body">
      <div class="game-card-title">BURG TYCOON</div>
      <div class="game-card-sub">Capitalist · Adventure</div>
    </div>
  </div>

</div>

<!-- ─── MAIN LAYOUT ────────────────────────────────────────────────────────── -->
<div class="game-layout">

  <!-- GAME COLUMN -->
  <div class="game-column" id="gameColumn">
    <div class="game-container">
      <div class="game-header">
        <span class="game-title" id="gameTitle">🧱 BURGER BREAKER</span>
      </div>

      <div class="game-frame-wrap" id="gameFrame">
        <iframe id="gameIframe" src="" scrolling="no" allow="autoplay; accelerometer; gyroscope" title="BHB Game"></iframe>
      </div>
    </div>
  </div>

</div><!-- /game-layout -->

<script src="../assets/bhb.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════
//  GAME CONFIGS — native canvas dimensions for correct proportions
// ═══════════════════════════════════════════════════════════════════
const GAMES = {
  burgerdrop: {
    title:   '🍔 BURGER DROP',
    src:     '/game/burger_drop/index.html',
    nativeW: 9, nativeH: 16,        // standard 9:16 mobile
  },
  burgerbreaker: {
    title:   '🧱 BURGER BREAKER',
    src:     '/game/burger_breaker/index.html',
    nativeW: 540, nativeH: 780,
  },
  burgtycoon: {
    title:   '🏙️ BURG TYCOON',
    src:     '/game/burg_tycoon/index.html',
    nativeW: 390, nativeH: 700,
  },
};

// ═══════════════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════════════
let activeGame = 'burgerbreaker';

// ═══════════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════════
window.addEventListener('DOMContentLoaded', () => {
  selectGameByKey('burgerbreaker');
  window.addEventListener('resize', resizeGameFrame);
});

// ═══════════════════════════════════════════════════════════════════
//  GAME FRAME SIZING — respects native proportions
// ═══════════════════════════════════════════════════════════════════
function resizeGameFrame() {
  const cfg = GAMES[activeGame];
  if (!cfg) return;

  const isMobile = window.innerWidth <= 780;
  const frameEl  = document.getElementById('gameFrame');
  const colEl    = document.getElementById('gameColumn');

  if (isMobile) {
    // Fill full width, then derive height from the width the frame ACTUALLY
    // gets. The mobile rule forces .game-frame-wrap to 100%, which is narrower
    // than the column by the container's 3px borders — measuring after layout
    // keeps the aspect ratio exact instead of ~2% too tall.
    colEl.style.flexBasis = 'auto';
    colEl.style.width     = '100%';
    frameEl.style.width   = '';
    const w = frameEl.offsetWidth || (window.innerWidth - 20);
    frameEl.style.height  = Math.round(w * cfg.nativeH / cfg.nativeW) + 'px';
    return;
  }

  // Desktop: max column width 560px, max height = viewport - nav - header - padding
  const maxW = 560;
  const maxH = window.innerHeight - 190; // nav + page header + game header + padding
  const ar   = cfg.nativeW / cfg.nativeH;

  // Scale to fit within both max width and max height
  let w = maxW;
  let h = Math.round(w / ar);
  if (h > maxH) { h = maxH; w = Math.round(h * ar); }

  frameEl.style.width  = w + 'px';
  frameEl.style.height = h + 'px';

  // Let the column hug its content rather than pinning it to the frame width —
  // the container's 3px borders sit outside the frame, and pinning the column
  // to `w` pushed the game 6px off-centre.
  colEl.style.flex  = '0 0 auto';
  colEl.style.width = '';
}

// ═══════════════════════════════════════════════════════════════════
//  GAME SELECTION
// ═══════════════════════════════════════════════════════════════════
function selectGame(card) {
  document.querySelectorAll('.game-card').forEach(c => c.classList.remove('active'));
  card.classList.add('active');
  selectGameByKey(card.dataset.game);
}

function selectGameByKey(key) {
  const cfg = GAMES[key];
  if (!cfg) return;
  activeGame = key;

  document.getElementById('gameTitle').textContent = cfg.title;
  document.getElementById('gameIframe').src        = cfg.src;

  resizeGameFrame();
}
</script>

</body>
</html>
